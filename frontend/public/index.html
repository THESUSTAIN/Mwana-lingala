                m.content = "noindex, nofollow, noarchive";
                document.head.appendChild(m);
                // Also override canonical to stay on the prod URL so any accidental
                // preview share still credits prod in Google's eyes
                var can = document.querySelector('link[rel="canonical"]');
                if (can) can.href = "https://mwana-lingala.com" + window.location.pathname;
              }
            } catch (e) { /* noop */ }
          })();
        </script>

        <!-- SEO & tracking: indexation + GA ONLY on production. Any other host (Emergent preview,
             staging, localhost, Railway default url) is marked noindex to avoid duplicate content
             and data leaks. Runs inline BEFORE React renders. -->
        <script>
          (function () {
            try {
              var h = window.location.hostname;
              var p = window.location.pathname || "/";
              // Force apex domain — redirect any "www.mwana-lingala.com/*" to "mwana-lingala.com/*"
              // This avoids duplicate-content SEO issues and matches the canonical version.
              if (h === "www.mwana-lingala.com") {
                window.location.replace("https://mwana-lingala.com" + window.location.pathname + window.location.search + window.location.hash);
                return;
              }
              var isProd = (h === "mwana-lingala.com");
              // Always noindex: previews, app pages, auth flow, widgets
              var alwaysNoindex = (
                !isProd ||
                p.indexOf("/app") === 0 ||
                p.indexOf("/auth/") === 0 ||
                p.indexOf("/widget/") === 0 ||
                p.indexOf("/billing/") === 0 ||
                p.indexOf("/login") === 0 ||
                p.indexOf("/register") === 0
              );
              if (alwaysNoindex) {
                var m = document.createElement("meta");
                m.name = "robots";
                m.content = "noindex, nofollow, noarchive";
                document.head.appendChild(m);
                if (!isProd) {
                  var can = document.querySelector('link[rel="canonical"]');
                  if (can) can.href = "https://mwana-lingala.com" + window.location.pathname;
                }
              }
            } catch (e) { /* noop */ }
          })();
        </script>

[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["python3", "nodejs_20", "yarn", "gcc"]
nixOverlays = []

[phases.install]
cmds = [
    "node --version",
    "python3 -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r backend/requirements.txt",
    "cd frontend && yarn install --frozen-lockfile"
]

[phases.build]
cmds = [
    "cd frontend && yarn build"
]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
